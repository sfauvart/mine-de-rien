# Serveur d'essai, jetable, utilisé par la skill /essai-en-jeu.
# Il ne partage RIEN avec le monde réel de l'enfant : autre projet compose, autre dossier,
# autres ports. Monde plat, paisible, graine fixe pour que les coordonnées soient stables.
#
#   docker compose -f docker/essai.compose.yml --env-file .env up -d
#   docker compose -f docker/essai.compose.yml exec minecraft rcon-cli "list"
name: mine-de-rien-essai

services:
  minecraft:
    image: itzg/minecraft-server
    environment:
      EULA: ${EULA:-FALSE}
      TYPE: PAPER
      VERSION: ${MC_VERSION:-LATEST}
      ONLINE_MODE: ${ONLINE_MODE:-TRUE}
      MEMORY: 1G
      ENABLE_RCON: "true"
      RCON_PASSWORD: essai
      LEVEL_TYPE: flat
      SEED: "20261107"
      MODE: creative
      DIFFICULTY: peaceful
      SPAWN_PROTECTION: "0"
      MOTD: "Mine de rien - essai"
      # Recopié dans world/datapacks à chaque démarrage : le monde suit le dépôt.
      DATAPACKS: /datapacks/mine_de_rien
      # Un serveur installé avant le chat vocal garde dans server.properties l'adresse de
      # l'ancien pack de sons et l'autorisation de renvoyer le jeu : ces deux lignes les
      # effacent. Retirer la variable ne suffirait pas, l'image laisserait l'ancienne valeur.
      RESOURCE_PACK: ""
      ACCEPTS_TRANSFERS: "FALSE"
      # Le chat vocal, version épinglée : celle du mod à installer dans le jeu du testeur
      # (docs/rejoindre-le-serveur.md). Téléchargé sur Modrinth au démarrage, comme Paper.
      MODRINTH_PROJECTS: "simple-voice-chat:bukkit-2.6.27"
      # Le plugin maison, construit avant le premier lancement (plugin/README.md).
      PLUGINS: /plugin-maison/mine-de-rien-voix.jar
      # Où le plugin maison lit les sons que l'agent dépose (« cargo run -- parler … »).
      MDR_VOIX_DOSSIER: /sons
    ports:
      - "25566:25565"
      - "25576:25575"
      # Le chat vocal, entre le jeu et le serveur. 24464 et non 24454, le port d'usage : le
      # serveur d'essai ne prend pas celui du vrai serveur. Le jeu joint le port que le
      # serveur lui annonce : celui-ci est aussi réglé dans essai-plugins/voicechat.
      - "24464:24464/udp"
    volumes:
      - ../data/essai:/data
      - ../datapacks:/datapacks:ro
      # Réglages des plugins, recopiés dans plugins/ à chaque démarrage.
      - ./essai-plugins:/plugins:ro
      - ../plugin/target:/plugin-maison:ro
      # Écrit par l'agent sur le poste, lu par le serveur.
      - ../data/essai-sons:/sons:ro

  # Voix de synthèse pour les dictées, jointe par `cargo run` sur le poste (port 5055).
  #   docker compose -f docker/essai.compose.yml --profile voix up -d voix
  # La voix se télécharge une fois dans data/voix, partagé avec le vrai serveur :
  #   docker compose -f docker/essai.compose.yml --profile voix run --rm voix \
  #     piper.download_voices --download-dir /voix fr_FR-siwis-medium
  voix:
    profiles: ["voix"]
    image: mine-de-rien-voix:piper-1.8.0
    build:
      context: .
      dockerfile: voix.Dockerfile
    command:
      - piper.http_server
      - --host=0.0.0.0
      - --port=5000
      - --data-dir=/voix
      - --model=${VOIX:-fr_FR-siwis-medium}
    ports:
      - "127.0.0.1:5055:5000"
    volumes:
      - ../data/voix:/voix
