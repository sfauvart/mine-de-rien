# Serveur d'essai, jetable, utilisé par la skill /essai-en-jeu.
# Il ne partage RIEN avec le monde réel de l'enfant : autre projet compose, autre dossier,
# autres ports. Monde plat, paisible, graine fixe pour que les coordonnées soient stables.
#
#   docker compose -f docker/essai.compose.yml --env-file .env up -d
#   docker compose -f docker/essai.compose.yml exec minecraft rcon-cli "list"
name: mine-de-rien-essai

services:
  minecraft:
    image: itzg/minecraft-server
    environment:
      EULA: ${EULA:-FALSE}
      TYPE: PAPER
      VERSION: ${MC_VERSION:-LATEST}
      ONLINE_MODE: ${ONLINE_MODE:-TRUE}
      MEMORY: 1G
      ENABLE_RCON: "true"
      RCON_PASSWORD: essai
      LEVEL_TYPE: flat
      SEED: "20261107"
      MODE: creative
      DIFFICULTY: peaceful
      SPAWN_PROTECTION: "0"
      MOTD: "Mine de rien - essai"
      # Recopié dans world/datapacks à chaque démarrage : le monde suit le dépôt.
      DATAPACKS: /datapacks/mine_de_rien
    ports:
      - "25566:25565"
      - "25576:25575"
    volumes:
      - ../data/essai:/data
      - ../datapacks:/datapacks:ro

  # Voix de synthèse pour les dictées, jointe par `cargo run` sur le poste (port 5055).
  #   docker compose -f docker/essai.compose.yml --profile voix up -d voix
  # La voix se télécharge une fois dans data/voix, partagé avec le vrai serveur :
  #   docker compose -f docker/essai.compose.yml --profile voix run --rm voix \
  #     piper.download_voices --download-dir /voix fr_FR-siwis-medium
  voix:
    profiles: ["voix"]
    image: mine-de-rien-voix:piper-1.8.0
    build:
      context: .
      dockerfile: voix.Dockerfile
    command:
      - piper.http_server
      - --host=0.0.0.0
      - --port=5000
      - --data-dir=/voix
      - --model=${VOIX:-fr_FR-siwis-medium}
    ports:
      - "127.0.0.1:5055:5000"
    volumes:
      - ../data/voix:/voix
