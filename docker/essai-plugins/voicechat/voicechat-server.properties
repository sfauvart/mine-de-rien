# Réglages du chat vocal (Simple Voice Chat) sur le serveur d'essai. Seules les clés qui
# s'écartent des valeurs d'usage sont écrites ici ; le plugin complète le fichier.

# Port UDP entre le jeu et le serveur : celui que publie docker/essai.compose.yml.
port=24464
# Les joueurs ne forment pas de groupes de discussion : le chat vocal ne sert qu'à faire
# entendre la voix de Mine de rien.
enable_groups=false
