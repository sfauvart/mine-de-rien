services:
  # Ponctuel : livre au serveur, avant son démarrage, ce qui vient avec la version de
  # l'agent : le datapack dans data/datapacks, le plugin de la voix et les réglages du chat
  # vocal dans data/plugins. Tout vient de la même image, donc de la même version.
  livraison:
    image: ghcr.io/sfauvart/mine-de-rien:0.2.0
    command: ["mine-de-rien", "livrer", "--datapack", "/datapacks", "--plugin", "/plugins"]
    volumes:
      - ./data/datapacks:/datapacks
      - ./data/plugins:/plugins

  minecraft:
    image: itzg/minecraft-server:2026.10.1-java25
    environment:
      EULA: ${EULA:-FALSE}
      TYPE: PAPER
      VERSION: ${MC_VERSION:-LATEST}
      # FALSE accepte les comptes hors ligne : lire docs/rejoindre-le-serveur.md avant.
      ONLINE_MODE: ${ONLINE_MODE:-TRUE}
      MEMORY: 2G
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD}
      MOTD: "Mine de rien"
      # Zone de l'atelier en mode aventure, recopiée dans world/datapacks à chaque démarrage.
      DATAPACKS: /datapacks/mine_de_rien
      # Liste blanche active et appliquée, mais vide au départ : le pseudo de l'enfant s'ajoute
      # par RCON (docs/installation.md). La variable WHITELIST de l'image ferait résoudre le
      # pseudo par un service en ligne (PlayerDB ou Mojang), ce qu'on évite.
      ENABLE_WHITELIST: "true"
      ENFORCE_WHITELIST: "true"
      # Pack de sons des dictées, servi par l'agent : l'adresse de cette machine vue depuis le
      # poste de l'enfant, ex. http://192.168.1.20:8765/mine-de-rien.zip. Vide : pas de pack.
      # Facultatif pour le joueur : si l'agent est arrêté, le serveur reste jouable.
      RESOURCE_PACK: ${PACK_URL:-}
      RESOURCE_PACK_ENFORCE: "FALSE"
      # Permet à l'agent de renvoyer le jeu de l'enfant vers ce serveur (commande « transfer »)
      # pour qu'il recharge les sons d'une nouvelle dictée sans se déconnecter à la main.
      ACCEPTS_TRANSFERS: "TRUE"
      # Le chat vocal (Simple Voice Chat), par lequel l'enfant entend la voix. Version
      # épinglée : le mod de son jeu doit porter la même (docs/rejoindre-le-serveur.md).
      # Téléchargé sur Modrinth au démarrage du serveur, comme Paper.
      MODRINTH_PROJECTS: "simple-voice-chat:bukkit-2.6.27"
      # Où le plugin de Mine de rien lit les sons que l'agent dépose.
      MDR_VOIX_DOSSIER: /sons
      # Aucun opérateur : un enfant opérateur peut lire la réponse ou se donner la récompense.
    ports:
      - "25565:25565"
      # Le chat vocal, entre le jeu de l'enfant et le serveur. Jamais redirigé sur la box.
      - "24454:24454/udp"
    volumes:
      - ./data/minecraft:/data
      - ./data/datapacks:/datapacks:ro
      # Le plugin de la voix et les réglages du chat vocal, recopiés dans plugins/ à chaque
      # démarrage du serveur.
      - ./data/plugins:/plugins:ro
      # Les sons à faire entendre : écrits par l'agent, seulement lus par le serveur.
      - ./data/sons:/sons:ro
    depends_on:
      livraison:
        condition: service_completed_successfully
    restart: unless-stopped

  agent:
    image: ghcr.io/sfauvart/mine-de-rien:0.2.0
    # Construire sa propre image depuis le clone, sans ghcr.io : docker compose build agent
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    env_file: .env
    # Pack de sons des dictées ([pack] de config.toml), téléchargé par le jeu de l'enfant.
    ports:
      - "8765:8765"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./data/agent:/data
      - ./data/minecraft:/minecraft:ro   # lecture du log serveur
      - ./data/sons:/sons                # [voix] dossier_du_jeu : ce que le chat vocal joue
    depends_on:
      - minecraft
    # « sans-sortie » : pour joindre la voix quand le profil voix est lancé.
    networks: [default, sans-sortie]
    restart: unless-stopped

  # Voix de synthèse 100 % locale, pour les dictées. Lancer avec :
  #   docker compose --profile voix up -d
  # après avoir téléchargé la voix une fois (docs/installation.md) :
  #   docker compose --profile voix-installation run --rm voix-telecharger
  voix:
    profiles: ["voix"]
    image: mine-de-rien-voix:piper-1.8.0
    build:
      context: docker
      dockerfile: voix.Dockerfile
    command:
      - piper.http_server
      - --host=0.0.0.0
      - --port=5000
      - --data-dir=/voix
      - --model=${VOIX:-fr_FR-siwis-medium}
    volumes:
      - ./data/voix:/voix:ro
    # Aucun port publié, et un réseau sans accès à Internet : seul l'agent lui parle.
    networks: [sans-sortie]
    restart: unless-stopped

  # Ponctuel : télécharge la voix dans data/voix depuis Hugging Face, puis s'arrête.
  voix-telecharger:
    profiles: ["voix-installation"]
    image: mine-de-rien-voix:piper-1.8.0
    build:
      context: docker
      dockerfile: voix.Dockerfile
    command: ["piper.download_voices", "--download-dir", "/voix", "${VOIX:-fr_FR-siwis-medium}"]
    volumes:
      - ./data/voix:/voix

  # LLM 100 % local. Lancer avec : docker compose --profile local-llm up -d
  llm:
    profiles: ["local-llm"]
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      --host 0.0.0.0 --port 8080
      --model /models/${LLM_MODEL_FILE:-model.gguf}
      --ctx-size 8192
    volumes:
      - ./data/models:/models:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

networks:
  sans-sortie:
    internal: true
