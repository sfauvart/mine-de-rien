services:
  minecraft:
    image: itzg/minecraft-server
    environment:
      EULA: ${EULA:-FALSE}
      TYPE: PAPER
      VERSION: ${MC_VERSION:-LATEST}
      # FALSE accepte les comptes hors ligne : lire docs/rejoindre-le-serveur.md avant.
      ONLINE_MODE: ${ONLINE_MODE:-TRUE}
      MEMORY: 2G
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD}
      MOTD: "Mine de rien"
      # Zone de l'atelier en mode aventure, recopiée dans world/datapacks à chaque démarrage.
      DATAPACKS: /datapacks/mine_de_rien
    ports:
      - "25565:25565"
    volumes:
      - ./data/minecraft:/data
      - ./datapacks:/datapacks:ro
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    env_file: .env
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./data/agent:/data
      - ./data/minecraft:/minecraft:ro   # lecture du log serveur
    depends_on:
      - minecraft
    restart: unless-stopped

  # LLM 100 % local. Lancer avec : docker compose --profile local-llm up -d
  llm:
    profiles: ["local-llm"]
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      --host 0.0.0.0 --port 8080
      --model /models/${LLM_MODEL_FILE:-model.gguf}
      --ctx-size 8192
    volumes:
      - ./data/models:/models:ro
    ports:
      - "8080:8080"
    restart: unless-stopped
