[project]
name = "mine-de-rien"
version = "0.1.0"
description = "Les devoirs se font sans que personne ne s'en aperçoive : un agent qui met les devoirs en jeu dans Minecraft."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Sébastien Fauvart" }]
dependencies = [
    "mcrcon>=0.7",
    "python-telegram-bot>=21",
    "anthropic>=0.40",
    "httpx>=0.27",
]

[project.scripts]
mine-de-rien = "mine_de_rien.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mine_de_rien"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
