# Un tag vX.Y.Z publie l'image de l'agent (datapack compris) sur ghcr.io, pour amd64 et arm64.
# Rien n'est publié sur un simple push. Procédure : docs/publier-une-version.md.
name: Publier l'image

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # La version de Rust et ses composants sont figés dans rust-toolchain.toml.
      - name: Installer la chaîne Rust
        run: rustup toolchain install
      - name: Mise en forme
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Le tag correspond à la version déclarée
        run: MDR_TAG="$GITHUB_REF_NAME" cargo test --locked --test version

  publier:
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      # Pas de QEMU : le binaire est compilé sur la plateforme du runner pour les deux
      # architectures, et l'image finale ne contient aucune commande à exécuter.
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/agent.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
