# Un tag voix-X.Y.Z publie l'image de la voix (Piper et son serveur HTTP) sur ghcr.io, pour
# amd64 et arm64. X.Y.Z est la version de Piper figée dans docker/voix.Dockerfile : l'image
# ne change que quand Piper change, pas à chaque version de l'agent.
# Procédure : docs/publier-une-version.md.
name: Publier l'image de la voix

on:
  push:
    tags: ["voix-*.*.*"]

permissions:
  contents: read

jobs:
  publier:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Le tag correspond à la version de Piper du Dockerfile
        id: version
        run: |
          version="${GITHUB_REF_NAME#voix-}"
          grep -q "piper-tts\[http\]==${version}\"" docker/voix.Dockerfile
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # QEMU : l'image installe Piper par pip, ce qui s'exécute pour chaque architecture.
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: docker
          file: docker/voix.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-voix:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
