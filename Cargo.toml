[package]
name = "mine-de-rien"
version = "0.1.2"
edition = "2024"
rust-version = "1.94"
description = "Les devoirs se font sans que personne ne s'en aperçoive : un agent qui met les devoirs en jeu dans Minecraft."
license = "MIT"
authors = ["Sébastien Fauvart"]
readme = "README.md"
repository = "https://github.com/sfauvart/mine-de-rien"
publish = false

[lib]
name = "mine_de_rien"
path = "src/lib.rs"

[[bin]]
name = "mine-de-rien"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
include_dir = "0.7.4"
num-bigint = "0.4"
num-rational = "0.4.2"
num-traits = "0.2.19"
rand = "0.10.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "net", "fs", "sync", "signal", "io-util"] }
toml = { version = "1.2.1", features = ["preserve_order"] }
unicode-normalization = "0.1.26"

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
